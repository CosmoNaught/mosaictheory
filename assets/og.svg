<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1428"/>
      <stop offset="30%" stop-color="#1a2850"/>
      <stop offset="55%" stop-color="#5060a0"/>
      <stop offset="75%" stop-color="#b08898"/>
      <stop offset="100%" stop-color="#f2e2de"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bg)" filter="url(#grain)" opacity="0.08"/>
  <text x="600" y="300" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-4">Evidence first.</text>
  <text x="600" y="400" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.6)">The intelligence layer between AI research and what comes next.</text>
  <text x="600" y="570" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="3">MOSAIC THEORY</text>
</svg>
